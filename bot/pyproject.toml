[project]
name = "pipecat-unreal-room-bot"
version = "0.1.0"
description = "Three characters in a house in an Unreal Engine game: Jev reads the room, an LLM speaks as each character, each in their own voice from where they stand"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[cartesia,deepgram,jev,openai,runner,silero,websocket]==1.12.0",
    # The Daily transport (-t daily): daily-python is for Linux and macOS only, so on Windows the
    # bot runs over the WebSocket, or in WSL.
    "pipecat-ai[daily]==1.12.0; sys_platform != 'win32'",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pyright>=1.1.404,<2", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.12.11,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
