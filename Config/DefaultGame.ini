[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=1914266715,B=1290734012,C=-1523806413,D=1056731587)
ProjectName=Pipecat Room

[/Script/PipecatRoom.RoomSubsystem]
; The bot's start endpoint. -PipecatStartUrl=... on the command line overrides it.
StartUrl="http://localhost:7860/start"
; The game runs at this many frames per second, at most, so it's smooth.
FrameRateLimit=60
; As many frames again are shown with DLSS Frame Generation, where the GPU has
; it and NVIDIA's DLSS plugins are there.
bFrameGeneration=True
; Shown in HDR where the display and Windows have it on, as bright as the
; display is at its brightest, in nits.
bHDR=True
HDRNits=1000
; Only the game on screen, e.g. to record it: True for the engine's warnings,
; e.g. about memory or DLSS, and how the connection to the bot is going.
bDebugMessages=False

[/Script/PipecatRoom.RoomStage]
; The characters, read by the bot too: their names, colors, voices, which
; mannequin they are, and the room they live in.
CastFile=bot/characters.json
; How the game talks to the bot: daily (bot.py -t daily, a voice track per
; character) or websocket (bot.py -t websocket, a channel per character).
Transport=daily
; How far the player's voice carries, in cm, at their usual loudness: twice as
; far for every 6 dB louder, between these. Half as far through a wall.
NormalRange=600
MinRange=280
MaxRange=2200
ThroughWalls=0.5
; How far the characters' voices carry, for who hears whom (the player too).
CharacterRange=650
; How their voices sound: full volume within so many cm, fading out over so
; many more, and how loud through a wall (0 to 1).
VoiceFullWithin=150
VoiceFadesOver=850
VoiceThroughWalls=0.3
; Coming this close to a character, in plain view, the player has come up to
; them (they still wait to be spoken to).
MeetDistance=480
; The quietest the microphone counts as the player speaking, in dBFS.
SpeechMinDb=-46
; Only send the bot the microphone while you're speaking (silence otherwise),
; so the game's music and voices, if the microphone hears them, aren't you.
bGateMicrophone=True

[/Script/PipecatRoom.RoomHouse]
; How long the sun takes to drift across the sky and back, in seconds.
SunDriftSeconds=360
