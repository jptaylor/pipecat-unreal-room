[URL]
GameName=PipecatRoom

[/Script/EngineSettings.GameMapsSettings]
; The engine's empty map. The game builds the house when play begins.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry
TransitionMap=
bUseSplitscreen=True
TwoPlayerSplitscreenLayout=Horizontal
ThreePlayerSplitscreenLayout=FavorTop
GlobalDefaultGameMode=/Game/ThirdPerson/Blueprints/BP_ThirdPersonGameMode.BP_ThirdPersonGameMode_C
GlobalDefaultServerGameMode=None
bOffsetPlayerGamepadIds=False

[/Script/Engine.RendererSettings]
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False
; Lumen traces the scene with the GPU's ray tracing hardware, for truer bounced
; light, shadow and reflections, and lights the reflections where the rays
; hit. It falls back to software tracing without it. The characters are
; skinned on the GPU so they're in the traced scene, and cast shadows in it.
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
; MegaLights: every lamp in the house casts soft, ray traced shadows, however
; many there are, at a steady cost. It needs the ray tracing hardware, and the
; lights fall back to shadow maps without it.
r.MegaLights.EnableForProject=1
; Light shafts through the windows and the skylights, in a faint haze.
r.VolumetricFog=1

[SystemSettings]
; Smoother bounced light indoors, from four times as many probes as Epic
; quality's, blended over fewer frames so it keeps up with the lamps that
; swing and sweep.
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.Lumen.ScreenProbeGather.Temporal.MaxFramesAccumulated=10
; Calmer reflections on the polished floors.
r.Lumen.Reflections.Contrast=0.75
r.Lumen.Reflections.MaxRoughnessToTrace=0.6
; The sun's shadows sharp, and their soft edges smooth, as in Cinematic.
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.5
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8
; Finer volumetric fog, for crisp light shafts: it's in the rendered
; resolution's pixels, which DLSS halves.
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
; The sky through the windows ray marched, rather than looked up from tables.
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0
r.SkyAtmosphere.SampleCountMax=64
; A steadier image, from more frames.
r.TSR.History.SampleCount=32
; Rendered at a lower resolution when it needs to be, for 60 frames per second
; with a little to spare, down to half the display's, and scaled up to it.
r.DynamicRes.OperationMode=2
r.DynamicRes.FrameTimeBudget=15.5
r.DynamicRes.MinScreenPercentage=50
; (Where the GPU has DLSS, the game renders at a fixed resolution instead:
; see URoomSubsystem::StartDLSS.)
r.DynamicRes.MaxScreenPercentage=100
; With NVIDIA's DLSS plugins, where the GPU has DLSS, it scales the image up
; instead, sharper, and Frame Generation keeps up with the changing resolution.
; Reflex keeps the game responsive. Without them, these do nothing.
r.NGX.DLSS.Enable=1
r.Streamline.DLSSG.DynamicResolutionMode=1
t.Streamline.Reflex.Enable=1
; HDR is allowed, for the game to show itself in it where it can.
r.AllowHDR=1

